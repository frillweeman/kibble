; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3_wroom_n8r2]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

; N8R2 = 8 MB flash, 2 MB PSRAM
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv

; Helps with auto-reset on generic/off-brand boards
upload_speed = 115200
upload_flags =
    --no-stub
    --before=no_reset

; Simulation mode: swap motor/button for NeoPixel LED + serial commands.
; Remove -D SIMULATION_MODE when real hardware is ready.
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    bblanchon/ArduinoJson@^7
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    adafruit/Adafruit NeoPixel@^1.12.3
