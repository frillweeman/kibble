<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Kibble</title>
  <script>
    // Apply a saved theme before first paint to avoid a flash of the wrong palette.
    try {
      const t = localStorage.getItem('kibble-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch {}
  </script>
  <link rel="icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
  <style>
    /* ── Reset & base ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f4f6f9;
      --surface:   #ffffff;
      --border:    #e2e7ef;
      --text:      #1a1d23;
      --muted:     #6b7280;
      --accent:    #4f8ef7;
      --accent-dk: #3a7ae8;
      --success:   #16a34a;
      --success-bg:#dcfce7;
      --error:     #dc2626;
      --error-bg:  #fee2e2;
      --warn-bg:   #fef9c3;
      --accent-hover-bg: #eef4ff;
      --danger-dk: #b91c1c;
      --dot-idle:  #d1d5db;
      --toast-bg:  #1a1d23;
      --toast-fg:  #ffffff;
      --radius:    12px;
      --shadow:    0 1px 4px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.05);
      color-scheme: light;
    }

    /* Dark palette: explicit choice, or system preference when no choice is saved. */
    :root[data-theme="dark"] {
      --bg:        #0f1115;
      --surface:   #171a20;
      --border:    #2a2f3a;
      --text:      #e6e8ec;
      --muted:     #9aa3b2;
      --accent:    #3b82f6;
      --accent-dk: #2f6fdb;
      --success:   #4ade80;
      --success-bg:#12301f;
      --error:     #f87171;
      --error-bg:  #3b1a1a;
      --warn-bg:   #3a3414;
      --accent-hover-bg: #1a2740;
      --danger-dk: #dc2626;
      --dot-idle:  #4b5563;
      --toast-bg:  #e6e8ec;
      --toast-fg:  #0f1115;
      --shadow:    0 1px 4px rgba(0,0,0,.5), 0 4px 16px rgba(0,0,0,.35);
      color-scheme: dark;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:        #0f1115;
        --surface:   #171a20;
        --border:    #2a2f3a;
        --text:      #e6e8ec;
        --muted:     #9aa3b2;
        --accent:    #3b82f6;
        --accent-dk: #2f6fdb;
        --success:   #4ade80;
        --success-bg:#12301f;
        --error:     #f87171;
        --error-bg:  #3b1a1a;
        --warn-bg:   #3a3414;
        --accent-hover-bg: #1a2740;
        --danger-dk: #dc2626;
        --dot-idle:  #4b5563;
        --toast-bg:  #e6e8ec;
        --toast-fg:  #0f1115;
        --shadow:    0 1px 4px rgba(0,0,0,.5), 0 4px 16px rgba(0,0,0,.35);
        color-scheme: dark;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0 0 48px;
    }

    /* ── Header ──────────────────────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header .icon { font-size: 24px; line-height: 1; }
    header h1 { font-size: 18px; font-weight: 700; letter-spacing: -.3px; }
    header .conn-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--dot-idle); margin-left: 4px;
      transition: background .4s;
    }
    header .theme-btn {
      margin-left: auto;
      background: none; border: 1px solid var(--border); color: var(--muted);
      border-radius: 8px; height: 32px; padding: 0 10px; cursor: pointer;
      font-size: 13px; font-weight: 600; line-height: 1;
    }
    header .theme-btn:hover { background: var(--bg); color: var(--text); }
    header .conn-dot.online  { background: var(--success); }
    header .conn-dot.offline { background: var(--error); }

    /* ── Layout ──────────────────────────────────────────────────────────── */
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Card ────────────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* ── Status grid ─────────────────────────────────────────────────────── */
    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .stat {
      background: var(--bg);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex; flex-direction: column; gap: 3px;
    }
    .stat-label { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .stat-value { font-size: 13px; font-weight: 600; line-height: 1.3; word-break: break-word; }
    .stat-value.success { color: var(--success); }
    .stat-value.error   { color: var(--error); }

    /* ── Dispense ────────────────────────────────────────────────────────── */
    .dispense-row {
      display: flex; align-items: center; gap: 12px;
    }
    .stepper {
      display: flex; align-items: center;
      border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden;
      flex-shrink: 0;
    }
    .stepper button {
      background: none; border: none; cursor: pointer;
      width: 38px; height: 44px;
      font-size: 20px; font-weight: 300; color: var(--text);
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .stepper button:hover { background: var(--bg); }
    .stepper button:active { background: var(--border); }
    .stepper span {
      width: 38px; text-align: center;
      font-size: 16px; font-weight: 700;
    }

    .btn {
      flex: 1; height: 44px;
      background: var(--accent); color: #fff;
      border: none; border-radius: 8px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      transition: background .15s, transform .1s, opacity .2s;
      letter-spacing: -.2px;
    }
    .btn:hover  { background: var(--accent-dk); }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .5; cursor: default; transform: none; }
    .btn.danger { background: var(--error); }
    .btn.danger:hover { background: var(--danger-dk); }
    .btn.ghost {
      background: none; color: var(--muted);
      border: 1px solid var(--border);
      font-size: 13px; font-weight: 600;
    }
    .btn.ghost:hover { background: var(--bg); color: var(--text); }

    /* Dispense status message */
    #dispense-status {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px; font-weight: 500;
      display: none;
    }
    #dispense-status.pending {
      background: var(--warn-bg);
      display: block;
    }
    #dispense-status.success {
      background: var(--success-bg); color: var(--success);
      display: block;
    }
    #dispense-status.error {
      background: var(--error-bg); color: var(--error);
      display: block;
    }

    /* ── Schedule ────────────────────────────────────────────────────────── */
    .schedule-list {
      display: flex; flex-direction: column; gap: 8px;
      margin-bottom: 12px;
    }
    .schedule-entry {
      display: flex; align-items: center; gap: 8px;
    }
    .time-input-group {
      display: flex; align-items: center; gap: 4px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 0 10px; height: 40px;
      flex: 1;
    }
    .time-input-group input[type=number] {
      background: none; border: none; outline: none;
      font-size: 16px; font-weight: 700; color: var(--text);
      width: 32px; text-align: center;
      -moz-appearance: textfield;
    }
    .time-input-group input[type=number]::-webkit-inner-spin-button,
    .time-input-group input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    .time-input-group .sep { font-weight: 700; color: var(--muted); }
    .time-input-group .clicks-label { font-size: 11px; color: var(--muted); margin-left: 8px; }
    .time-input-group input.clicks {
      width: 28px;
    }

    .ampm-toggle {
      display: flex;
      gap: 4px;
      margin-left: 8px;
      flex-shrink: 0;
    }
    .ampm-btn {
      background: none; border: 1px solid var(--border); cursor: pointer;
      padding: 0 8px; height: 28px;
      font-size: 11px; font-weight: 700; color: var(--muted);
      border-radius: 6px;
      transition: background .15s, color .15s, border-color .15s;
      letter-spacing: .04em;
    }
    .ampm-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .remove-btn {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 18px; line-height: 1;
      padding: 6px; border-radius: 6px;
      transition: color .15s, background .15s;
      flex-shrink: 0;
    }
    .remove-btn:hover { color: var(--error); background: var(--error-bg); }

    .schedule-actions {
      display: flex; gap: 8px;
    }
    .add-btn {
      background: none; border: 1px dashed var(--border);
      border-radius: 8px; padding: 8px 14px;
      font-size: 13px; font-weight: 600; color: var(--muted);
      cursor: pointer; width: 100%;
      transition: border-color .15s, color .15s, background .15s;
      margin-bottom: 12px;
    }
    .add-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-hover-bg); }

    /* ── Log ─────────────────────────────────────────────────────────────── */
    .log-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .log-day-heading {
      font-size: 11px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--muted);
      padding: 4px 2px 6px;
      margin-top: 8px;
    }
    .log-day-heading:first-child { margin-top: 0; }
    .log-entries {
      display: flex; flex-direction: column; gap: 6px;
    }
    .log-entry {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      background: var(--success-bg);
    }
    .log-entry.retry-source { background: var(--error-bg); }
    .log-retry-ref { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .log-icon { font-size: 15px; line-height: 1.4; flex-shrink: 0; }
    .log-body { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .log-time { font-weight: 600; color: var(--text); }
    .log-clicks { color: var(--muted); font-size: 12px; }
    .log-error-msg { color: var(--error); font-size: 12px; margin-top: 2px; font-style: italic; }
    .log-empty { color: var(--muted); font-size: 14px; text-align: center; padding: 20px 0; }

    /* ── Diagnostics ─────────────────────────────────────────────────────── */
    details.diag > summary {
      cursor: pointer; list-style: none;
      font-size: 11px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--muted);
    }
    details.diag > summary::-webkit-details-marker { display: none; }
    details.diag > summary::before { content: '▸ '; }
    details.diag[open] > summary::before { content: '▾ '; }
    .diag-tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 10px; align-items: center; }
    .diag-tools .btn { flex: none; height: 32px; padding: 0 12px; display: inline-flex; align-items: center; text-decoration: none; }
    .diag-tools select {
      height: 32px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 13px; padding: 0 8px;
    }
    #debug-log {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px; font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      max-height: 320px; overflow: auto; white-space: pre; color: var(--text);
    }

    /* ── Spinner ─────────────────────────────────────────────────────────── */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Misc ────────────────────────────────────────────────────────────── */
    .section-save-row {
      display: flex; gap: 8px; margin-top: 4px;
    }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--toast-bg); color: var(--toast-fg);
      padding: 10px 20px; border-radius: 8px;
      font-size: 13px; font-weight: 500;
      opacity: 0; pointer-events: none;
      transition: opacity .3s;
      white-space: nowrap;
      z-index: 100;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<header>
  <span class="icon">🐾</span>
  <h1>Kibble</h1>
  <button class="theme-btn" id="theme-btn" onclick="cycleTheme()"></button>
  <div class="conn-dot" id="conn-dot" title="Connection status"></div>
</header>

<main>

  <!-- Status ─────────────────────────────────────────────────── -->
  <div class="card">
    <div class="card-title">Status</div>
    <div class="status-grid">
      <div class="stat">
        <div class="stat-label">Device time</div>
        <div class="stat-value" id="s-current">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Last fed</div>
        <div class="stat-value" id="s-last">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Next feed</div>
        <div class="stat-value" id="s-next">—</div>
      </div>
    </div>
  </div>

  <!-- Manual dispense ─────────────────────────────────────────── -->
  <div class="card">
    <div class="card-title">Feed Now</div>
    <div class="dispense-row">
      <div class="stepper">
        <button id="dec-btn" onclick="changeClicks(-1)" aria-label="Decrease">−</button>
        <span id="click-count">1</span>
        <button id="inc-btn" onclick="changeClicks(1)" aria-label="Increase">+</button>
      </div>
      <button class="btn" id="dispense-btn" onclick="dispense()">Feed Now</button>
    </div>
    <div id="dispense-status"></div>
  </div>

  <!-- Schedule ────────────────────────────────────────────────── -->
  <div class="card">
    <div class="card-title">Schedule</div>
    <div class="schedule-list" id="schedule-list"></div>
    <button class="add-btn" onclick="addScheduleEntry()">+ Add feeding time</button>
    <div class="section-save-row">
      <button class="btn" id="save-schedule-btn" onclick="saveSchedule()" style="font-size:14px;height:40px;">Save Schedule</button>
    </div>
  </div>

  <!-- Feed log ─────────────────────────────────────────────────── -->
  <div class="card">
    <div class="log-header">
      <div class="card-title" style="margin:0;">Feed Log</div>
      <button class="btn ghost" style="height:32px;padding:0 12px;flex:none;" onclick="clearLog()">Clear</button>
    </div>
    <div class="log-entries" id="log-entries"></div>
  </div>

  <!-- Diagnostics ──────────────────────────────────────────────── -->
  <div class="card">
    <details class="diag" id="diag" ontoggle="if (this.open) loadDebugLog()">
      <summary>Diagnostics</summary>
      <div class="diag-tools">
        <select id="diag-file" onchange="loadDebugLog()" aria-label="Log file">
          <option value="current">Current log</option>
          <option value="old">Previous log</option>
        </select>
        <button class="btn ghost" onclick="loadDebugLog()">Refresh</button>
        <a class="btn ghost" id="diag-download" href="/api/debuglog?lines=2000" target="_blank" rel="noopener">Open full</a>
        <button class="btn ghost" onclick="clearDebugLog()">Clear</button>
      </div>
      <pre id="debug-log">Open to load…</pre>
    </details>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
  // ── Config ──────────────────────────────────────────────────────────────────
  const API = '';  // same origin; set to e.g. 'http://192.168.1.50' for dev
  const STATUS_INTERVAL_MS  = 15_000;  // normal status refresh
  const POLL_INTERVAL_MS    = 1_000;   // while waiting for dispense result
  const PER_CLICK_TIMEOUT_MS = 10_000; // firmware MOTOR_TIMEOUT_MS, per click
  const DISPENSE_GRACE_MS    = 10_000; // extra slack for queueing / slow loop

  // ── State ───────────────────────────────────────────────────────────────────
  let clickCount = 1;
  let dispensePollTimer = null;
  let statusTimer       = null;
  let lastLogEntries    = [];

  // ── Helpers ─────────────────────────────────────────────────────────────────
  const _today     = new Date();
  const _todayKey  = _today.toDateString();
  const _yesterday = new Date(_today); _yesterday.setDate(_today.getDate() - 1);
  const _yesterdayKey = _yesterday.toDateString();

  function dayLabel(d) {
    const k = d.toDateString();
    if (k === _todayKey)     return 'Today';
    if (k === _yesterdayKey) return 'Yesterday';
    return d.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});
  }

  function fmt(isoOrNever) {
    if (!isoOrNever || isoOrNever === 'never') return 'never';
    const d = new Date(isoOrNever);
    if (isNaN(d)) return isoOrNever;
    const timeStr = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit', hour12: true});
    if (d.toDateString() === _todayKey) return timeStr;
    return dayLabel(d) + ' ' + timeStr;
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function showToast(msg, duration = 2500) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), duration);
  }

  // ── Theme ───────────────────────────────────────────────────────────────────
  const THEMES = ['system', 'light', 'dark'];
  const THEME_ICON = {system: '◐ Auto', light: '☀ Light', dark: '☾ Dark'};
  let theme = 'system';
  try { theme = localStorage.getItem('kibble-theme') || 'system'; } catch {}
  if (!THEMES.includes(theme)) theme = 'system';

  function applyTheme() {
    const root = document.documentElement;
    if (theme === 'system') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', theme);
    const b = document.getElementById('theme-btn');
    b.textContent = THEME_ICON[theme];
    b.title = 'Theme: ' + theme + ' (click to change)';
    b.setAttribute('aria-label', b.title);
  }
  function cycleTheme() {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    try { localStorage.setItem('kibble-theme', theme); } catch {}
    applyTheme();
  }

  // ── Click stepper ───────────────────────────────────────────────────────────
  function changeClicks(delta) {
    clickCount = Math.max(1, Math.min(10, clickCount + delta));
    document.getElementById('click-count').textContent = clickCount;
    document.getElementById('dec-btn').disabled = clickCount <= 1;
    document.getElementById('inc-btn').disabled = clickCount >= 10;
  }

  // ── Status ──────────────────────────────────────────────────────────────────
  async function fetchStatus() {
    try {
      const r = await fetch(`${API}/api/status`);
      if (!r.ok) throw new Error();
      const d = await r.json();
      document.getElementById('conn-dot').className = 'conn-dot online';
      const cur = document.getElementById('s-current');
      const approx = d.clockSource && d.clockSource !== 'ntp';
      cur.textContent = fmt(d.currentTime) + (approx ? ' ≈' : '');
      cur.title = approx ? 'Approximate: restored from flash, waiting for network time (NTP)' : '';
      document.getElementById('s-next').textContent    = fmt(d.nextFeedTime);
      // last feed is coloured based on the most recent log entry
      const lastEl = document.getElementById('s-last');
      lastEl.textContent = fmt(d.lastFeedTime);
      // colouring done by fetchLog
    } catch {
      document.getElementById('conn-dot').className = 'conn-dot offline';
    }
  }

  // ── Log ─────────────────────────────────────────────────────────────────────
  async function fetchLog() {
    try {
      const r = await fetch(`${API}/api/log`);
      if (!r.ok) throw new Error();
      const entries = await r.json();
      lastLogEntries = entries;
      renderLog(entries);
      colourLastFeed(entries);
      return entries;
    } catch {
      return null;
    }
  }

  function renderLog(entries) {
    const el = document.getElementById('log-entries');
    if (!entries || entries.length === 0) {
      el.innerHTML = '<div class="log-empty">No feeds recorded yet.</div>';
      return;
    }

    function entryHtml(e) {
      const isErr  = !!e.error;
      const d      = new Date(e.ts * 1000);
      const timeStr = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit', hour12: true});
      const errorLine = isErr
        ? `<div class="log-error-msg">⚠ ${e.error}</div>` : '';
      const retryLine = e.retryFor
        ? `<div class="log-retry-ref">↩ retry for missed ${new Date(e.retryFor * 1000).toLocaleTimeString([], {hour:'numeric', minute:'2-digit', hour12: true})}</div>` : '';
      const approxLine = e.clock === 'approx'
        ? `<div class="log-retry-ref">≈ time approximate — clock not yet synced</div>` : '';
      const isRetrySource = isErr && e.error === 'missed feed — device was offline';
      return `<div class="log-entry ${isRetrySource ? 'retry-source' : isErr ? 'error' : ''}">
        <div class="log-icon">${isRetrySource ? '⏸' : isErr ? '✗' : '✓'}</div>
        <div class="log-body">
          <div class="log-time">${timeStr}</div>
          <div class="log-clicks">${e.clicks} portion${e.clicks !== 1 ? 's' : ''}${isErr ? ' delivered' : ''}</div>
          ${errorLine}
          ${retryLine}
          ${approxLine}
        </div>
      </div>`;
    }

    // Newest first, grouped by day
    const sorted = [...entries].reverse();
    let html = '';
    let lastDayKey = null;
    for (const e of sorted) {
      const d = new Date(e.ts * 1000);
      const dk = d.toDateString();
      if (dk !== lastDayKey) {
        html += `<div class="log-day-heading">${dayLabel(d)}</div>`;
        lastDayKey = dk;
      }
      html += entryHtml(e);
    }
    el.innerHTML = html;
  }

  function colourLastFeed(entries) {
    const el = document.getElementById('s-last');
    if (!entries || entries.length === 0) {
      el.className = 'stat-value';
      return;
    }
    const last = entries[entries.length - 1];
    el.className = 'stat-value ' + (last.error ? 'error' : 'success');
  }

  async function clearLog() {
    if (!confirm('Clear all feed history?')) return;
    try {
      const r = await fetch(`${API}/api/log`, {method:'DELETE'});
      if (!r.ok) throw new Error();
      lastLogEntries = [];
      renderLog([]);
      colourLastFeed([]);
      document.getElementById('s-last').textContent = 'never';
      showToast('Log cleared');
    } catch {
      showToast('Failed to clear log');
    }
  }

  // ── Dispense ─────────────────────────────────────────────────────────────────
  // POST returns a request id; we poll GET /api/dispense/{id} for exactly that
  // request's outcome (independent of the feed log, which is capped and also
  // records scheduled feeds).
  function dispenseDone(btn, msgEl, cls, text) {
    clearInterval(dispensePollTimer);
    dispensePollTimer = null;
    btn.disabled = false;
    btn.textContent = 'Feed Now';
    msgEl.className = cls;
    msgEl.textContent = text;
    fetchLog();
    fetchStatus();
  }

  async function dispense() {
    const btn   = document.getElementById('dispense-btn');
    const msgEl = document.getElementById('dispense-status');
    const clicks = clickCount;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Feeding…';
    msgEl.className = 'pending';
    msgEl.textContent = 'Dispensing… watching for result.';

    let id;
    try {
      const r = await fetch(`${API}/api/dispense`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({clicks})
      });
      if (r.status === 409) throw new Error('a feed is already in progress');
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      id = (await r.json()).id;
      if (!id) throw new Error('no request id returned');
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Feed Now';
      msgEl.className = 'error';
      msgEl.textContent = 'Failed to start feed — ' + (err.message || 'no response');
      return;
    }

    const deadline = Date.now() + clicks * PER_CLICK_TIMEOUT_MS + DISPENSE_GRACE_MS;
    let inFlight = false;

    clearInterval(dispensePollTimer);
    dispensePollTimer = setInterval(async () => {
      if (inFlight) return;
      inFlight = true;
      try {
        const r = await fetch(`${API}/api/dispense/${id}`);
        if (r.status === 404) {
          dispenseDone(btn, msgEl, 'error', 'Result no longer available — check the feed log.');
          return;
        }
        if (r.ok) {
          const d = await r.json();
          if (d.state === 'done') {
            if (d.error) dispenseDone(btn, msgEl, 'error', `⚠ ${d.error}`);
            else dispenseDone(btn, msgEl, 'success',
              `✓ ${d.delivered} portion${d.delivered !== 1 ? 's' : ''} delivered successfully.`);
            return;
          }
        }
      } catch { /* transient network error: keep polling until the deadline */ }
      finally { inFlight = false; }

      if (Date.now() > deadline) {
        dispenseDone(btn, msgEl, 'error', 'No result from the feeder yet — check the feed log.');
      }
    }, POLL_INTERVAL_MS);
  }

  // ── Schedule ─────────────────────────────────────────────────────────────────
  function addScheduleEntry(hour = 8, minute = 0, clicks = 1) {
    const list = document.getElementById('schedule-list');
    const row = document.createElement('div');
    row.className = 'schedule-entry';

    // Convert 24h to 12h display
    const meridiem = hour < 12 ? 'AM' : 'PM';
    const h12 = hour % 12 || 12;

    row.innerHTML = `
      <div class="time-input-group">
        <input type="number" class="hour" min="1" max="12" value="${h12}" aria-label="Hour" />
        <span class="sep">:</span>
        <input type="number" class="minute" min="0" max="59" value="${pad(minute)}" aria-label="Minute" />
        <span class="clicks-label">portions</span>
        <input type="number" class="clicks" min="1" max="10" value="${clicks}" aria-label="Portions" />
        <div class="ampm-toggle">
          <button type="button" class="ampm-btn${meridiem === 'AM' ? ' active' : ''}" data-val="AM">AM</button>
          <button type="button" class="ampm-btn${meridiem === 'PM' ? ' active' : ''}" data-val="PM">PM</button>
        </div>
      </div>
      <button class="remove-btn" onclick="this.closest('.schedule-entry').remove()" aria-label="Remove">✕</button>
    `;

    // AM/PM toggle
    row.querySelectorAll('.ampm-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        row.querySelectorAll('.ampm-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    // Clamp inputs on blur
    row.querySelector('.hour').addEventListener('blur', e => {
      e.target.value = Math.min(12, Math.max(1, parseInt(e.target.value) || 12));
    });
    row.querySelector('.minute').addEventListener('blur', e => {
      e.target.value = pad(Math.min(59, Math.max(0, parseInt(e.target.value) || 0)));
    });
    row.querySelector('.clicks').addEventListener('blur', e => {
      e.target.value = Math.min(10, Math.max(1, parseInt(e.target.value) || 1));
    });

    list.appendChild(row);
  }

  function readScheduleFromDOM() {
    const entries = [];
    document.querySelectorAll('#schedule-list .schedule-entry').forEach(row => {
      const h12 = parseInt(row.querySelector('.hour').value) || 12;
      const m   = parseInt(row.querySelector('.minute').value) || 0;
      const c   = parseInt(row.querySelector('.clicks').value) || 1;
      const pm  = row.querySelector('.ampm-btn.active')?.dataset.val === 'PM';
      let h24 = h12 % 12;  // 12 AM → 0, 12 PM → 0 before adding
      if (pm) h24 += 12;   // PM: 1-11 → 13-23, 12 → 12
      entries.push({hour: h24, minute: m, clicks: c});
    });
    return entries;
  }

  async function loadSchedule() {
    try {
      const r = await fetch(`${API}/api/schedule`);
      if (!r.ok) throw new Error();
      const entries = await r.json();
      document.getElementById('schedule-list').innerHTML = '';
      entries
        .slice()
        .sort((a, b) => (a.hour * 60 + a.minute) - (b.hour * 60 + b.minute))
        .forEach(e => addScheduleEntry(e.hour, e.minute, e.clicks));
    } catch {
      document.getElementById('schedule-list').innerHTML = '';
    }
  }

  async function saveSchedule() {
    const btn = document.getElementById('save-schedule-btn');
    const entries = readScheduleFromDOM();
    btn.disabled = true;
    btn.textContent = 'Saving…';
    try {
      const r = await fetch(`${API}/api/schedule`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(entries)
      });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      showToast('Schedule saved ✓');
    } catch (err) {
      showToast('Save failed — ' + (err.message || 'error'));
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save Schedule';
    }
  }

  // ── Diagnostics ──────────────────────────────────────────────────────────────
  async function loadDebugLog() {
    const pre = document.getElementById('debug-log');
    const file = document.getElementById('diag-file').value;
    try {
      const r = await fetch(`${API}/api/debuglog?lines=300&file=${file}`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const text = await r.text();
      pre.textContent = text.trim() ? text : '(empty)';
      pre.scrollTop = pre.scrollHeight;
    } catch (err) {
      pre.textContent = 'Could not load log — ' + (err.message || 'no response');
    }
  }

  async function clearDebugLog() {
    if (!confirm('Clear the diagnostics log?')) return;
    try {
      const r = await fetch(`${API}/api/debuglog`, {method: 'DELETE'});
      if (!r.ok) throw new Error();
      showToast('Diagnostics cleared');
      loadDebugLog();
    } catch {
      showToast('Failed to clear diagnostics');
    }
  }

  // ── Boot ─────────────────────────────────────────────────────────────────────
  async function init() {
    applyTheme();
    changeClicks(0); // set initial button states
    await Promise.all([fetchStatus(), fetchLog(), loadSchedule()]);

    clearInterval(statusTimer);
    statusTimer = setInterval(() => {
      if (!dispensePollTimer) {
        fetchStatus();
        fetchLog();
      }
    }, STATUS_INTERVAL_MS);
  }

  init();
</script>
</body>
</html>
